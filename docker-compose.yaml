services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW_AWS_CONN_ID: ${AIRFLOW_AWS_CONN_ID:-aws_glue_conn}
      AIRFLOW_CONN_AWS_GLUE_CONN: '{"conn_type":"aws","extra":{"region_name":"${AWS_DEFAULT_REGION:-ap-south-1}"}}'
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      CUSTOMER_DATA_BUCKET: ${CUSTOMER_DATA_BUCKET:?Set CUSTOMER_DATA_BUCKET in .env}
      CUSTOMER_INPUT_KEY: ${CUSTOMER_INPUT_KEY:-raw/customers/customers.csv}
      CUSTOMER_GLUE_JOB_NAME: ${CUSTOMER_GLUE_JOB_NAME:-COADP-Customer-ETL-DEV}
      MAX_REJECTION_PERCENTAGE: ${MAX_REJECTION_PERCENTAGE:-20}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ${HOME}/.aws:/home/airflow/.aws:ro
    user: "${AIRFLOW_UID:-50000}:0"
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username admin --password admin
      --firstname Airflow --lastname Admin --role Admin --email admin@example.com || true)"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ${HOME}/.aws:/home/airflow/.aws:ro
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8080:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ${HOME}/.aws:/home/airflow/.aws:ro
    user: "${AIRFLOW_UID:-50000}:0"
    command: scheduler
    restart: unless-stopped

volumes:
  postgres-db-volume:
