name: AWS Glue Customer Pipeline CI

on:
  push:
    branches:
      - "feature/**"
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run PySpark Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyspark==3.5.6 pytest boto3 cfn-lint

      - name: Run unit and integration tests
        run: |
          python -m pytest tests/unit tests/integration -v
          python -m compileall -q airflow/dags lambda/trigger_glue
          python -m json.tool infrastructure/parameters/dev.json > /dev/null
          cfn-lint -t infrastructure/template.yaml
          cp .env.example .env
          docker compose config --quiet
