AWSTemplateFormatVersion: '2010-09-09'
Description: Customer Data Pipeline Infrastructure

Parameters:
  ProjectName:
    Type: String
    Description: Project name used for resource naming
    Default: customer-pipeline
  Environment:
    Type: String
    Description: Deployment environment
    AllowedValues:
      - dev
      - test
      - prod

Resources:

  CustomerDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-${AWS::AccountId}-data'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  GlueArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-${AWS::AccountId}-glue-artifacts'

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

Outputs:

  CustomerDataBucketName:
    Description: Customer pipeline data bucket
    Value: !Ref CustomerDataBucket

  GlueArtifactsBucketName:
    Description: Glue script artifact bucket
    Value: !Ref GlueArtifactsBucket
