AWSTemplateFormatVersion: '2010-09-09'
Description: Customer pipeline storage, event-driven Lambda trigger, Glue Catalog and Athena discovery

Parameters:
  ProjectName:
    Type: String
    Default: customer-pipeline
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
  LambdaArtifactKey:
    Type: String
    Default: lambda/trigger_glue.zip
  GlueJobName:
    Type: String
    Default: COADP-Customer-ETL-DEV
    Description: Existing AWS Glue ETL job name
  MaxRejectionPercentage:
    Type: Number
    Default: 20
    MinValue: 0
    MaxValue: 100
  AthenaResultsPrefix:
    Type: String
    Default: athena-results/

Resources:
  CustomerDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-${AWS::AccountId}-data'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  GlueArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-${AWS::AccountId}-glue-artifacts'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  CustomerPipelineCatalog:
    Type: AWS::Glue::Database
    Properties:
      CatalogInput:
        Name: !Sub '${ProjectName}_${Environment}'
        Description: Customer pipeline curated and rejected datasets

  CustomerPipelineIdempotency:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${Environment}-lambda-idempotency'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: object_id
          AttributeType: S
      KeySchema:
        - AttributeName: object_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  CustomerTriggerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CustomerTriggerLeastPrivilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*'
              - Effect: Allow
                Action: [glue:StartJobRun]
                Resource: !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/${GlueJobName}'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt CustomerPipelineIdempotency.Arn

  CustomerTriggerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-trigger-glue'
      Runtime: python3.11
      Handler: handler.lambda_handler
      Role: !GetAtt CustomerTriggerLambdaRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        S3Bucket: !Ref GlueArtifactsBucket
        S3Key: !Ref LambdaArtifactKey
      Environment:
        Variables:
          GLUE_JOB_NAME: !Ref GlueJobName
          IDEMPOTENCY_TABLE: !Ref CustomerPipelineIdempotency
          MAX_REJECTION_PERCENTAGE: !Ref MaxRejectionPercentage

  CustomerRawObjectRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-raw-customer-created'
      Description: Start the customer pipeline when a raw customer CSV is created
      State: ENABLED
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket:
            name: [!Ref CustomerDataBucket]
          object:
            key:
              - prefix: raw/customers/
      Targets:
        - Id: CustomerTriggerLambdaTarget
          Arn: !GetAtt CustomerTriggerLambda.Arn

  AllowEventBridgeInvokeCustomerLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CustomerTriggerLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CustomerRawObjectRule.Arn

  CustomerCatalogCrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSGlueServiceRole'
      Policies:
        - PolicyName: ReadCustomerAnalyticsZones
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt CustomerDataBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject]
                Resource:
                  - !Sub '${CustomerDataBucket.Arn}/curated/customers/*'
                  - !Sub '${CustomerDataBucket.Arn}/rejected/customers/*'

  CustomerPipelineCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-customer-crawler'
      Role: !GetAtt CustomerCatalogCrawlerRole.Arn
      DatabaseName: !Ref CustomerPipelineCatalog
      Targets:
        S3Targets:
          - Path: !Sub 's3://${CustomerDataBucket}/curated/customers/'
          - Path: !Sub 's3://${CustomerDataBucket}/rejected/customers/'
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: DEPRECATE_IN_DATABASE
      Configuration: '{"Version":1.0,"Grouping":{"TableLevelConfiguration":3}}'

  CustomerAthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-analytics'
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub 's3://${CustomerDataBucket}/${AthenaResultsPrefix}'

Outputs:
  CustomerDataBucketName:
    Value: !Ref CustomerDataBucket
  GlueArtifactsBucketName:
    Value: !Ref GlueArtifactsBucket
  CustomerTriggerLambdaName:
    Value: !Ref CustomerTriggerLambda
  CustomerIdempotencyTable:
    Value: !Ref CustomerPipelineIdempotency
  CustomerCatalogDatabase:
    Value: !Ref CustomerPipelineCatalog
  CustomerCrawlerName:
    Value: !Ref CustomerPipelineCrawler
  AthenaWorkGroup:
    Value: !Ref CustomerAthenaWorkGroup
